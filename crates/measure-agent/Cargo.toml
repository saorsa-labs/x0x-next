[package]
name = "measure-agent"
version = "0.1.0"
description = "Experiment 16 instrument: one decision point in Measure mode, with seeded exploration, copies and replayable JSONL traces"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
policy-poc = { path = "../policy-poc", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[[bin]]
name = "measure-agent"
path = "src/bin/measure-agent.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
